<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PlaneMoon Planner</title><style>body{background:#101b30;color:#f4f6fc;font:16px system-ui;margin:0;padding:22px}main{max-width:720px;margin:auto}.panel{background:#1c2d47;border-radius:18px;padding:20px;margin:18px 0}button{background:#367bdd;color:white;border:0;border-radius:10px;padding:14px 18px;font-weight:700;width:100%}input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #7a8ca9;background:#101b30;color:white;margin:6px 0 12px}small{color:#bac8df}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:28px}</style></head><body><main><h1>🌙 PlaneMoon Planner</h1><p>Testovacia Android verzia 1.4</p><section class="panel"><h2>Stanovište</h2><label>Zemepisná šírka<input id="lat" type="number" step=".0001" value="48.8087"></label><label>Zemepisná dĺžka<input id="lon" type="number" step=".0001" value="19.3164"></label><button onclick="load()">Načítať živé ADS-B lietadlá</button><p id="status">Pripravené na test pripojenia.</p></section><section class="panel"><h2>Výsledok ADS-B</h2><div id="out">Zatiaľ bez údajov.</div></section><section class="panel"><h2>Plánovanie preletov</h2><p>Táto testovacia verzia zatiaľ nepredpovedá tranzity pred Mesiacom. Slúži na overenie natívneho prístupu k ADS-B API.</p></section></main><script>function load(){const lat=Number(document.getElementById('lat').value),lon=Number(document.getElementById('lon').value);document.getElementById('status').textContent='Načítavam…';if(!window.PlaneMoonAndroid){document.getElementById('status').textContent='Natívne rozhranie Android nie je dostupné.';return}window.PlaneMoonAndroid.loadAircraft(lat,lon)}window.onAircraftData=function(raw){try{const data=JSON.parse(raw);if(data.error){document.getElementById('status').textContent='Chyba: '+data.error;return}const arr=Array.isArray(data.ac)?data.ac:[];document.getElementById('status').textContent='Načítaných lietadiel: '+arr.length;document.getElementById('out').innerHTML='';for(const a of arr.slice(0,30)){const p=document.createElement('p');p.textContent=(a.flight||a.hex||'Neznáme')+' — '+(a.alt_baro||'?')+' ft — '+(a.gs||'?')+' kt';document.getElementById('out').appendChild(p)}}catch(e){document.getElementById('status').textContent='Neplatná odpoveď: '+e.message}};</script></body></html>
